name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary: neubibackup
            asset_name: neubibackup-darwin-arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            binary: neubibackup
            asset_name: neubibackup-darwin-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary: neubibackup.exe
            asset_name: neubibackup-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download restic binaries
        shell: bash
        run: ./scripts/download-restic.sh

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}" -o ${{ matrix.binary }} .

      - name: Create macOS app bundle
        if: matrix.goos == 'darwin'
        run: |
          mkdir -p NeubiBackup.app/Contents/MacOS
          mkdir -p NeubiBackup.app/Contents/Resources
          cp ${{ matrix.binary }} NeubiBackup.app/Contents/MacOS/neubibackup
          cat > NeubiBackup.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>neubibackup</string>
              <key>CFBundleIdentifier</key>
              <string>com.neubibackup.app</string>
              <key>CFBundleName</key>
              <string>NeubiBackup</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.VERSION }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.VERSION }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          zip -r ${{ matrix.asset_name }}.zip NeubiBackup.app

      - name: Upload macOS artifact
        if: matrix.goos == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

      - name: Upload Windows artifact
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.binary }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: NeubiBackup ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/neubibackup-darwin-arm64/neubibackup-darwin-arm64.zip
            artifacts/neubibackup-darwin-amd64/neubibackup-darwin-amd64.zip
            artifacts/neubibackup-windows-amd64.exe/neubibackup.exe
