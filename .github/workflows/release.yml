name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            goarch: arm64
            arch_name: arm64
          - os: macos-latest
            goarch: amd64
            arch_name: amd64

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          # Remove unnecessary large directories to free disk space
          # See: https://github.com/actions/runner-images/issues/2840
          # NOTE: Keep Xcode Command Line Tools for CGO compilation
          echo "Before cleanup:"
          df -h /

          # Remove Android SDK
          sudo rm -rf ~/Library/Android || true

          # Remove other large tools
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf ~/hostedtoolcache || true

          echo "After cleanup:"
          df -h /

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Download restic binary for macOS
        run: ./scripts/download-restic.sh darwin ${{ matrix.goarch }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          # Set SDKROOT and configure C compiler for cross-compilation
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          # Set minimum deployment target to avoid "requires macOS 15.0" issues
          # when cross-compiling from newer macOS versions
          CGO_FLAGS="-mmacosx-version-min=10.15"
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            export CGO_CFLAGS="-arch x86_64 ${CGO_FLAGS}"
            export CGO_LDFLAGS="-arch x86_64 ${CGO_FLAGS}"
          else
            export CGO_CFLAGS="${CGO_FLAGS}"
            export CGO_LDFLAGS="${CGO_FLAGS}"
          fi
          go build -ldflags "-X neubibackup/internal/version.Version=${{ steps.version.outputs.VERSION }}" -o neubibackup .

      - name: Verify binary architecture and deployment target
        run: |
          echo "Expected architecture: ${{ matrix.goarch }}"
          file neubibackup
          # Verify the architecture matches what we expected
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            file neubibackup | grep -q "x86_64" || (echo "ERROR: Binary is not x86_64!" && exit 1)
          else
            file neubibackup | grep -q "arm64" || (echo "ERROR: Binary is not arm64!" && exit 1)
          fi
          echo "Architecture verified successfully"

          # Check minimum macOS version requirement
          echo "Checking deployment target..."
          otool -l neubibackup | grep -A 3 "LC_BUILD_VERSION" || otool -l neubibackup | grep -A 3 "LC_VERSION_MIN_MACOSX" || true
          echo "Deployment target check complete"

      - name: Create app bundle
        run: |
          mkdir -p NeubiBackup.app/Contents/MacOS
          mkdir -p NeubiBackup.app/Contents/Resources
          cp neubibackup NeubiBackup.app/Contents/MacOS/neubibackup

          # Set the architecture string for Info.plist
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            ARCH_STRING="x86_64"
          else
            ARCH_STRING="arm64"
          fi

          cat > NeubiBackup.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>neubibackup</string>
              <key>CFBundleIdentifier</key>
              <string>com.neubibackup.app</string>
              <key>CFBundleName</key>
              <string>NeubiBackup</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.VERSION }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.VERSION }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSArchitecturePriority</key>
              <array>
                  <string>${ARCH_STRING}</string>
              </array>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>NeubiBackup uses your location to detect the current WiFi network name (SSID) for the allowed_ssids feature. This allows backups to run only on specific networks you configure.</string>
          </dict>
          </plist>
          EOF

          echo "Info.plist created with architecture: ${ARCH_STRING}"
          cat NeubiBackup.app/Contents/Info.plist

      - name: Sign app bundle
        run: |
          # Ad-hoc sign the entire app bundle (sign after copying binary, not before)
          codesign --force --deep --sign - NeubiBackup.app
          echo "App bundle signed successfully"
          codesign -dv --verbose=4 NeubiBackup.app

          # Verify the signature
          codesign --verify --verbose NeubiBackup.app

      - name: Create DMG installer
        run: |
          # Clean up to free disk space before DMG creation
          rm -rf internal/restic
          go clean -cache -modcache || true

          echo "Disk space before DMG creation:"
          df -h /

          # Get app size for DMG sizing
          APP_SIZE=$(du -sm NeubiBackup.app | cut -f1)
          DMG_SIZE=$((APP_SIZE + 10))m
          echo "App size: ${APP_SIZE}MB, DMG size: ${DMG_SIZE}"

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R NeubiBackup.app dmg_contents/

          # Create a symbolic link to Applications
          ln -s /Applications dmg_contents/Applications

          # Create the DMG using a writable image first, then convert
          # This approach is more reliable on constrained disk space
          # Use retry logic to handle transient "Resource busy" errors on GitHub Actions
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: Creating DMG..."
            if hdiutil create -volname "NeubiBackup" \
              -srcfolder dmg_contents \
              -fs HFS+ \
              -size ${DMG_SIZE} \
              -ov -format UDRW \
              temp.dmg; then
              echo "DMG created successfully on attempt $attempt"
              break
            else
              echo "Attempt $attempt failed"
              if [ $attempt -eq 5 ]; then
                echo "All attempts failed"
                exit 1
              fi
              echo "Waiting 5 seconds before retry..."
              sleep 5
            fi
          done

          # Convert to compressed read-only format
          hdiutil convert temp.dmg -format UDZO -o NeubiBackup-${{ matrix.arch_name }}.dmg
          rm -f temp.dmg

          echo "DMG created successfully:"
          ls -la NeubiBackup-${{ matrix.arch_name }}.dmg

      - name: Create ZIP for auto-updates
        run: |
          # Create ZIP containing the .app bundle (for go-selfupdate)
          # The ZIP must be created from the directory containing the .app
          # go-selfupdate expects naming: {cmd}_{goos}_{goarch}.zip
          cd dmg_contents
          zip -r ../neubibackup_darwin_${{ matrix.goarch }}.zip NeubiBackup.app
          cd ..
          echo "ZIP created successfully:"
          ls -la neubibackup_darwin_${{ matrix.goarch }}.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: neubibackup-darwin-${{ matrix.arch_name }}-dmg
          path: NeubiBackup-${{ matrix.arch_name }}.dmg

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: neubibackup-darwin-${{ matrix.goarch }}-zip
          path: neubibackup_darwin_${{ matrix.goarch }}.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Download restic binary for Windows
        shell: bash
        run: ./scripts/download-restic.sh windows amd64

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows resources with admin manifest
        run: go-winres make --in winres/winres.json --out rsrc_windows_amd64.syso --arch amd64

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -ldflags "-X neubibackup/internal/version.Version=${{ steps.version.outputs.VERSION }} -H windowsgui" -o neubibackup.exe .

      - name: Create NSIS installer script
        shell: bash
        run: |
          cat > installer.nsi << 'EOF'
          !include "MUI2.nsh"

          Name "NeubiBackup"
          OutFile "NeubiBackup-Setup.exe"
          InstallDir "$PROGRAMFILES64\NeubiBackup"
          RequestExecutionLevel admin

          !define MUI_ABORTWARNING
          !define MUI_ICON "${NSISDIR}\Contrib\Graphics\Icons\modern-install.ico"

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES

          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            SetOutPath "$INSTDIR"
            File "neubibackup.exe"

            ; Create uninstaller
            WriteUninstaller "$INSTDIR\Uninstall.exe"

            ; Create Start Menu shortcuts
            CreateDirectory "$SMPROGRAMS\NeubiBackup"
            CreateShortcut "$SMPROGRAMS\NeubiBackup\NeubiBackup.lnk" "$INSTDIR\neubibackup.exe"
            CreateShortcut "$SMPROGRAMS\NeubiBackup\Uninstall.lnk" "$INSTDIR\Uninstall.exe"

            ; Add to Add/Remove Programs
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\NeubiBackup" \
              "DisplayName" "NeubiBackup"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\NeubiBackup" \
              "UninstallString" "$\"$INSTDIR\Uninstall.exe$\""
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\NeubiBackup" \
              "InstallLocation" "$INSTDIR"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\NeubiBackup" \
              "Publisher" "NeubiBackup"
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\NeubiBackup" \
              "NoModify" 1
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\NeubiBackup" \
              "NoRepair" 1
          SectionEnd

          Section "Uninstall"
            Delete "$INSTDIR\neubibackup.exe"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"

            ; Remove Start Menu shortcuts
            Delete "$SMPROGRAMS\NeubiBackup\NeubiBackup.lnk"
            Delete "$SMPROGRAMS\NeubiBackup\Uninstall.lnk"
            RMDir "$SMPROGRAMS\NeubiBackup"

            ; Remove Task Scheduler entry for autostart
            nsExec::ExecToLog 'schtasks /Delete /TN "NeubiBackup" /F'

            ; Remove from Add/Remove Programs
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\NeubiBackup"
          SectionEnd
          EOF

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: neubibackup-windows-amd64-installer
          path: NeubiBackup-Setup.exe

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: neubibackup-windows-amd64-portable
          path: neubibackup.exe

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Prepare release files
        run: |
          mkdir -p release
          # macOS DMG files (for manual download/install)
          cp artifacts/neubibackup-darwin-arm64-dmg/NeubiBackup-arm64.dmg release/NeubiBackup-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg
          cp artifacts/neubibackup-darwin-amd64-dmg/NeubiBackup-amd64.dmg release/NeubiBackup-${{ steps.version.outputs.VERSION }}-macos-amd64.dmg
          # macOS ZIP files (for auto-updates via go-selfupdate)
          # go-selfupdate expects naming: {cmd}_{goos}_{goarch}.zip
          cp artifacts/neubibackup-darwin-arm64-zip/neubibackup_darwin_arm64.zip release/
          cp artifacts/neubibackup-darwin-amd64-zip/neubibackup_darwin_amd64.zip release/
          # Windows files
          cp artifacts/neubibackup-windows-amd64-installer/NeubiBackup-Setup.exe release/NeubiBackup-${{ steps.version.outputs.VERSION }}-windows-amd64-setup.exe
          # Windows portable EXE (for auto-updates via go-selfupdate)
          cp artifacts/neubibackup-windows-amd64-portable/neubibackup.exe release/neubibackup_windows_amd64.exe

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "Checksums generated:"
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NeubiBackup ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/neubibackup_darwin_arm64.zip
            release/NeubiBackup-${{ steps.version.outputs.VERSION }}-macos-arm64.dmg
            release/neubibackup_darwin_amd64.zip
            release/NeubiBackup-${{ steps.version.outputs.VERSION }}-macos-amd64.dmg
            release/NeubiBackup-${{ steps.version.outputs.VERSION }}-windows-amd64-setup.exe
            release/neubibackup_windows_amd64.exe
            release/SHA256SUMS.txt
