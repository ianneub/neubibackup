name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download restic binaries
        run: ./scripts/download-restic.sh

      - name: Run tests
        run: go test -v -race ./...

      - name: Run vet
        run: go vet ./...
